<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orleans persistent streams: 10.2.1 and 10.3.1</title>
    <style>
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #111418; color: #d8dde3; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      h2 { font-size: 15px; margin: 0 0 4px; }
      button, input, select { font: inherit; background: #222a33; color: inherit; border: 1px solid #3a4652; border-radius: 4px; padding: 2px 8px; }
      button:hover { background: #2e3945; cursor: pointer; }
      a { color: #7fb3ff; margin-right: 6px; }
      code { font: 12px ui-monospace, monospace; }
      .top { padding: 10px 14px; border-bottom: 1px solid #2a323b; }
      .scenarios div { margin: 2px 0; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
      .row form { margin-left: 16px; }
      .muted { color: #8a96a3; margin: 4px 0; }
      .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; }
      .legend span { white-space: nowrap; }
      main { display: grid; grid-template-columns: 1fr 320px; }
      .lanes { display: grid; grid-template-columns: 1fr 1fr; min-width: 0; }
      .lane { padding: 10px 14px; border-right: 1px solid #2a323b; min-width: 0; }
      aside { padding: 10px 14px; font-size: 12px; }
      .term { margin-bottom: 8px; }
      .term i { color: #8a96a3; }
      .result { padding: 4px 8px; border-radius: 4px; }
      .result.pass { background: #173a24; }
      .result.fail { background: #4a1c1c; }
      .strip { margin: 8px 0 12px; }
      .bar { position: relative; height: 12px; background: #1b2128; border-radius: 3px; overflow: hidden; }
      .bar .purged { position: absolute; top: 0; bottom: 0; left: 0; background: repeating-linear-gradient(45deg, #3a2a1a, #3a2a1a 4px, #1b2128 4px, #1b2128 8px); }
      .bar .cached { position: absolute; top: 0; bottom: 0; right: 0; background: #2b5d3c; }
      .ends { display: flex; justify-content: space-between; color: #8a96a3; }
      .mark { position: relative; height: 16px; }
      .mark span { position: absolute; white-space: nowrap; }
      .mark.stale span { color: #ff8a80; }
      .axis { position: relative; height: 14px; color: #6b7682; border-bottom: 1px solid #2a323b; }
      .axis span { position: absolute; transform: translateX(-50%); font-size: 11px; }
      .stream { padding: 4px 0; border-bottom: 1px solid #1f262d; }
      .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .badges span { padding: 0 6px; border-radius: 8px; background: #252c34; color: #8a96a3; }
      .badges span.on { background: #1d3a4f; color: #bfe0ff; }
      .badges span.bad { background: #4a1c1c; color: #ffb4ab; }
      .track { position: relative; height: 58px; overflow: hidden; }
      .m { position: absolute; transform: translateX(-50%); font-size: 13px; line-height: 14px; cursor: default; }
      .ok { color: #5fd38a; }
      .err { color: #ff6b6b; }
      .pub { color: #c9d1d9; }
      .hs { color: #6cb6ff; }
      .agent { color: #6cb6ff; font-weight: bold; }
      .cursor { color: #9aa7b4; }
      .cache { color: #ffa657; font-weight: bold; }
      .meta { color: #d2a8ff; font-weight: bold; }
      .dim { color: #8a96a3; }
      .log { max-height: 320px; overflow: auto; margin: 8px 0 0; padding-left: 30px; font-size: 12px; color: #aab4be; }
      .log li.err { color: #ff8a80; }
      .log li.ok { color: #9fe0b5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
